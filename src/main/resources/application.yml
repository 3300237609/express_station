# ============================================================
# 快递末端智能驿站系统 · 后端主配置（项目唯一配置入口，不混用 properties）
# ============================================================

server:
  port: 80
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: station-server

  # 排除默认内存用户：本项目使用自定义 JWT 认证，无需 Boot 生成的临时密码
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  # ---------------- 数据源（MySQL + Druid 连接池）----------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # characterEncoding 必须是 Java 合法字符集名（UTF-8），MySQL 侧对应 utf8mb4；写 utf8mb4 会导致 Unsupported character encoding 建连失败
    url: "jdbc:mysql://localhost:3306/express_station?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
    username: root
    # 密码通过环境变量 MYSQL_PASSWORD 注入，不提交明文；未设置时回退为本地开发默认值
    password: ${MYSQL_PASSWORD:root}
    druid:
      # 启动时不预创建连接：本地未启动 MySQL 应用也能正常启动，首次取连接时再建立
      initial-size: 0
      min-idle: 5
      max-active: 20
      max-wait: 60000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

  # ---------------- Redis（快递信息缓存；不可用时自动降级直查数据库）----------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 1
          max-wait: 3000ms

  # ---------------- Spring AI 1.1.8 GA / OpenAI Starter ----------------
  # API Key 优先读 OPENAI_API_KEY（百炼默认变量名），回退 LLM_API_KEY，都没配则降级规则引擎
  ai:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${LLM_API_BASE:https://dashscope.aliyuncs.com/compatible-mode}
      chat:
        options:
          model: qwen3.7-flash
          temperature: 0.3
          max-tokens: 512
    retry:
      max-attempts: 2
      backoff:
        multiplier: 2
        initial-interval: 1000ms

# ---------------- MyBatis ----------------
mybatis:
  # 全局 settings（驼峰映射、SQL 控制台打印）配置在 mybatis-config.xml
  config-location: classpath:mybatis/mybatis-config.xml
  type-aliases-package: com.example.station.entity
  mapper-locations: classpath:mybatis/mapper/*.xml

# ---------------- PageHelper 分页 ----------------
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# ---------------- JWT ----------------
jwt:
  # 签名密钥：生产环境必须通过环境变量 JWT_SECRET 注入（长度 ≥ 32 字节），不提交明文
  secret: ${JWT_SECRET:express-station-jwt-secret-change-me-0123456789}
  expire-days: 7
  cookie-name: authToken

# ---------------- 日志 ----------------
logging:
  level:
    root: info
    com.example.station: debug

# ---------------- 业务自定义配置 ----------------
station:
  pickup-recommend:
    # 是否启用 LLM Function Calling；false 则跳过 LLM 直接规则推荐（开发/离线环境可用）
    llm-enabled: ${PICKUP_RECOMMEND_LLM_ENABLED:true}
